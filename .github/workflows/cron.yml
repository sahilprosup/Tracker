name: ITP tracker cron

# Drives the Slack checkpoint nudges and end-of-day report without needing
# Vercel Cron or a third-party scheduler. Requires two repo secrets once the
# app is deployed:
#   APP_URL     - the deployed app's base URL (e.g. https://tracker.prolinegroup.au)
#   CRON_SECRET - must match CRON_SECRET in the app's environment
#
# Melbourne shifts between AEST (UTC+10) and AEDT (UTC+11) with daylight
# saving, but GitHub Actions cron is fixed UTC - there's no single UTC time
# that stays "08:30 Melbourne" year-round. Rather than hardcode one offset
# and drift an hour wrong for half the year, the checkpoint job runs every
# 15 minutes across a band that covers business hours in both AEST and AEDT;
# /api/cron/checkpoint itself computes real Melbourne wall-clock time (see
# lib/time.ts) and only acts on checkpoints due in the last 15 minutes, so
# firing it early/often is harmless - it just usually finds nothing due yet.
on:
  schedule:
    - cron: "*/15 21-23,0-8 * * *" # every 15 min, ~07:00-19:00 Melbourne across both DST regimes
    - cron: "0 9 * * *"            # once daily, ~19:00 AEST / 20:00 AEDT - end of day report
  workflow_dispatch: {}

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/15 21-23,0-8 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Hit checkpoint endpoint
        run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/checkpoint?secret=${{ secrets.CRON_SECRET }}"

  daily-report:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Hit daily report endpoint
        run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/daily-report?secret=${{ secrets.CRON_SECRET }}"
